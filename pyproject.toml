[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openshomer"
version = "0.1.0"
description = "Autonomous Agentic Security Engineer for LLM system prompts, agent configs, tool definitions, and MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenShomer Maintainers", email = "kavix@yahoo.com"}
]
keywords = ["security", "ai-agents", "llm-security", "mcp", "prompt-injection", "red-teaming"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyGithub>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mcp>=1.0.0,<2",
]

[project.scripts]
openshomer = "app.cli:app"
openshomer-mcp = "app.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "demo/vulnerable-agent/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
