name: "🐛 Bug Report"
description: "File a bug report or report unexpected behavior in OpenShomer."
title: "fix: [Short summary of the bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible so we can reproduce and remediate it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug and what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Run `openshomer scan ./agent`
        2. Encounter error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Expected the scan to complete cleanly and flag ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - CLI (`openshomer scan / fix`)
        - Terminal SOC UI (`openshomer tui`)
        - Investigation Agent & Remediation Engine
        - Multi-Framework Scanners (LangChain, LlamaIndex, CrewAI)
        - RAG & Vector Security Pipeline
        - MCP Server
        - MuleRun Workflow Runtime
        - GitHub Action & PR Delivery
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Version
      description: OS version, Python version, OpenShomer version (`openshomer version`).
      placeholder: macOS 15.0 / Python 3.11 / OpenShomer v0.4.0 / Docker
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified this behavior with the latest version of OpenShomer.
          required: true
