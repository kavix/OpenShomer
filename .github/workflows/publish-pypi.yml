name: Publish Python package to PyPI

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "app/**"
      - ".github/workflows/publish-pypi.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install --upgrade build twine tomli

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomli

          with open("pyproject.toml", "rb") as project_file:
              version = tomli.load(project_file)["project"]["version"]

          tag = os.environ["RELEASE_TAG"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          print(f"Release tag {tag} matches package version {version}")
          PY

      - name: Build source and wheel distributions without warnings
        run: |
          python -m build 2>&1 | tee build.log
          if grep -Eiq "warning|deprecat" build.log; then
            echo "::error::Build output contains a warning or deprecation."
            exit 1
          fi

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install wheel in a clean virtual environment and smoke-test CLI
        run: |
          python -m venv .venv-package-test
          .venv-package-test/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .venv-package-test/bin/openshomer version

      - name: Save distributions for release publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openshomer
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
