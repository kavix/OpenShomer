name: Contributor Helper Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  help:
    name: Respond to Helper Commands
    runs-on: ubuntu-latest

    if: >
      contains(github.event.comment.body, '/help') ||
      contains(github.event.comment.body, '#help') ||
      contains(github.event.comment.body, '/commands') ||
      contains(github.event.comment.body, '#commands') ||
      contains(github.event.comment.body, '/docs') ||
      contains(github.event.comment.body, '#docs')

    steps:
      - name: Send Command Help
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body.trim();
            const issueNumber = context.payload.issue.number;
            const { owner, repo } = context.repo;

            const isHelp = /(?:^|\s)(?:\/|#)(?:help|commands)\b/i.test(comment);
            const isDocs = /(?:^|\s)(?:\/|#)docs\b/i.test(comment);

            if (!isHelp && !isDocs) {
              return;
            }

            let responseBody = '';

            if (isHelp) {
              responseBody = `**OpenShomer Bot:** Available repository commands and resources:

| Command | Description |
|---|---|
| \`/assign\`, \`#assign\`, \`/take\`, \`#take\`, \`/claim\` | Assign issue/PR to yourself or specified user |
| \`/unassign\`, \`#unassign\`, \`/release\`, \`#release\` | Unassign issue/PR from yourself or specified user |
| \`/lgtm\`, \`LGTM!\`, \`#lgtm\` | Auto-merge an approved pull request via squash merge |
| \`/help\`, \`#help\`, \`/commands\` | Display this help menu |
| \`/docs\`, \`#docs\` | Provide links to project documentation and developer setup |

**Key Links:**
- Contributing Guide: https://github.com/kavix/OpenShomer/blob/main/CONTRIBUTING.md
- Discussions: https://github.com/kavix/OpenShomer/discussions
- Issue Tracker: https://github.com/kavix/OpenShomer/issues`;
            } else if (isDocs) {
              responseBody = `**OpenShomer Bot:** OpenShomer Documentation Index:

- Architecture & Threat Model: https://github.com/kavix/OpenShomer/blob/main/docs/USE_CASES.md
- Contributing Guide: https://github.com/kavix/OpenShomer/blob/main/CONTRIBUTING.md
- Code of Conduct: https://github.com/kavix/OpenShomer/blob/main/CODE_OF_CONDUCT.md
- Security Policy: https://github.com/kavix/OpenShomer/blob/main/SECURITY.md
- Local Setup: Run \`uv sync\` and \`uv run pytest -v\` or \`make test\`.`;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: responseBody
            });
