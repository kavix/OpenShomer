name: OpenShomer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.12.7"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Dependencies
      run: uv sync --all-groups

    - name: Run Ruff Checks
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run Test Suite
      run: uv run pytest -v

    - name: Validate Demo Fixture
      run: uv run pytest demo/vulnerable-agent/tests/test_agent.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t openshomer:ci .
