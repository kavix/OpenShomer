name: "OpenShomer AI Agent Security Action"
description: "Autonomous security engineer that finds AI agent config risks, red-teams minimal safe patches in a sandbox, and opens evidence-backed PRs."
author: "OpenShomer Maintainers"
branding:
  icon: "shield"
  color: "blue"

inputs:
  github_token:
    description: "GitHub Token with pull-request write permissions"
    required: false
    default: "${{ github.token }}"
  scan_path:
    description: "Path to agent repository directory to scan"
    required: false
    default: "."
  auto_pr:
    description: "Automatically open a PR if high-risk vulnerabilities are found and patched"
    required: false
    default: "false"
  exit_code:
    description: "Exit with code 1 on HIGH or CRITICAL findings in CI gates"
    required: false
    default: "true"
  dashscope_api_key:
    description: "Optional Alibaba Cloud DashScope / Qwen API key"
    required: false
  openai_api_key:
    description: "Optional OpenAI API key"
    required: false
  gemini_api_key:
    description: "Optional Gemini API key for dynamic LLM reasoning"
    required: false
  anthropic_api_key:
    description: "Optional Anthropic API key"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install OpenShomer
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run OpenShomer Security Scanner
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        DASHSCOPE_API_KEY: ${{ inputs.dashscope_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        if [ "${{ inputs.auto_pr }}" = "true" ]; then
          openshomer fix "${{ inputs.scan_path }}" --auto-pr
        else
          if [ "${{ inputs.exit_code }}" = "true" ]; then
            openshomer scan "${{ inputs.scan_path }}" --exit-code
          else
            openshomer scan "${{ inputs.scan_path }}" --no-exit-code
          fi
        fi
